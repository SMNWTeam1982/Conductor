[package]
name = "conductor"
version = "0.1.0"
authors = ["Kaitlyn Kenwell <redrield@gmail.com>"]
edition = "2018"
description = "A cross-platform driver station for FRC robots"
license-file = "LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Best current fork of web-view with latest Mac OS Support, as this is intended to target our school MacBooks
web-view = { git = "https://github.com/passy/web-view#aead339.git"}
lazy_static = "1.4.0"
rust-embed = "5.5.1"
serde = { version = "1.0.106", features = ["derive"] }
serde_json = "1.0.51"
ds = "1.2.4"
gilrs = "0.7.4"
actix-web = "2.0.0"
actix-rt = "1.1.0"
mime_guess = "2.0.3"
futures = "0.3.4"
env_logger = "0.7.1"
actix-web-actors = "2.0.0"
actix = "0.9.0"
log = "0.4.11"
conquer-once = "0.2.1"
uuid = { version = "0.8.1", features = ["v4"] }
confy = "0.4.0"
autopilot = "0.4.0"
tinyfiledialogs = "3.3.0"
human-panic = "1.0.3"
glfw = "0.41.0"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2.74"
x11 = { version = "2.18.2", features = ["xlib", "xinput", "xrandr"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.74"
core-graphics = "0.21.0"
objc = "0.2.7"
cocoa = "0.23.0"
block = "0.1.6"
core-foundation = "0.9.0"

[package.metadata.bundle]
name = "Conductor DS"
identifier = "io.github.Redrield.Conductor"
copyright = "MPL-2"
resources = ["images/icons/*.png"]
icon= ["images/icons/Conductor32x32.png", "images/icons/Conductor64x64.png", "images/icons/Conductor128x128.png", "images/icons/Conductor512x512.png", "images/icons/Conductor.icns", "images/icons/Conductor.svg"]
category = "Developer Tool"
short_description = "Conductor is an Open Source FRC Driver Station implementation"

[package.metadata.rpm]
package = "conductor"

[package.metadata.rpm.cargo]
buildflags = ["--release"]

[package.metadata.rpm.targets]
conductor = { path = "/usr/bin/conductor" }
