name: Build Status
on: [push, pull_request, workflow_dispatch]

env:
    CARGO_TERM_COLOR: always
    CI: false

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: rust-toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Install Dependencies
      run: |
        curl -sL https://deb.nodesource.com/setup_18.x | sudo -E bash -
        sudo apt-get install -y nodejs libudev-dev libx11-dev libxi-dev libpango1.0-dev libatk1.0-dev libsoup2.4-dev libgtk-3-dev libwebkit2gtk-4.0-dev
    - name: Install Cargo tools
      run: |
          cargo install cargo-bundle
    - name: Build Frontend
      run: |
        export NODE_OPTIONS=--openssl-legacy-provider && make setup && make frontend
    - name: Build DEB
      run: |
          cargo bundle --format deb --release
    - name: Run clippy
      run: cargo clippy -- -D warnings
    - name: rust-clippy-check
      uses: actions-rs/clippy-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: Ubuntu
    - name: Archive Raw Application
      uses: actions/upload-artifact@v4
      with:
        name: Conductor_ubuntu-latest
        path: target/release/conductor
    - name: Archive DEB
      uses: actions/upload-artifact@v4
      with:
          name: Conductor.deb
          path: target/release/bundle/deb/*.deb

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: rust-toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Install Dependencies
      run: |
        brew install node@18
        echo "/usr/local/opt/node@18/bin" >> $GITHUB_PATH
    - name: Install Cargo tools
      run: |
          cargo install cargo-bundle
    - name: Build Frontend
      run: |
        export NODE_OPTIONS=--openssl-legacy-provider && make setup && make frontend
    - name: Build App Bundle
      run: |
          cargo bundle --format app --release
    - name: Run clippy
      run: cargo clippy -- -D warnings
    - name: Archive Raw Application
      uses: actions/upload-artifact@v4
      with:
        name: Conductor_macos-latest
        path: target/release/conductor
    - name: Archive App Bundle
      uses: actions/upload-artifact@v4
      with:
          name: Conductor.app
          path: target/release/bundle/osx/*.app

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust-toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Dependencies
        run: |
          curl -sL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs libudev-dev libx11-dev libxi-dev libpango1.0-dev libatk1.0-dev libsoup2.4-dev libgtk-3-dev libwebkit2gtk-4.0-dev
      - name: Build frontend
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider && make setup && make frontend
      - name: Check formatting
        run: cargo fmt --all -- --check