name: Build Status
on: [push, pull_request, workflow_dispatch]

env:
    CARGO_TERM_COLOR: always
    CI: false

jobs:
  build-ubuntu:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: rust-toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: clippy
    - name: Install Dependencies
      run: |
        sudo sh -c 'echo "deb http://gb.archive.ubuntu.com/ubuntu jammy main" >> /etc/apt/sources.list'
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.0-dev
        sudo sed -i '/deb http:\/\/gb.archive.ubuntu.com\/ubuntu jammy main/d' /etc/apt/sources.list
        sudo apt-get update
        curl -sL https://deb.nodesource.com/setup_18.x | sudo -E bash -
        sudo apt-get install -y nodejs libudev-dev libx11-dev libxi-dev libpango1.0-dev libatk1.0-dev libsoup2.4-dev libgtk-3-dev
    - name: Install Cargo tools
      run: |
        cargo install cargo-bundle
    - name: Build Frontend
      run: |
        export NODE_OPTIONS=--openssl-legacy-provider && make setup && make frontend
    - name: Build DEB
      run: |
        cargo bundle --format deb --release
    - name: rust-clippy-check
      uses: actions-rs/clippy-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: Ubuntu
        args: -- -D warnings
    - name: Archive Raw Application
      uses: actions/upload-artifact@v4
      with:
        name: Conductor_ubuntu-latest
        path: target/release/conductor
    - name: Archive DEB
      uses: actions/upload-artifact@v4
      with:
        name: Conductor.deb
        path: target/release/bundle/deb/*.deb

  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: rust-toolchain
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: clippy
    - name: Install Dependencies
      run: |
        brew install webkitgtk
        curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.3/install.sh | bash
        export NVM_DIR="$HOME/.nvm"
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm install 18
        nvm use 18
    - name: Install Cargo tools
      run: |
        cargo install cargo-bundle
    - name: Build Frontend
      run: |
        export NODE_OPTIONS=--openssl-legacy-provider && make setup && make frontend
    - name: Build App
      run: |
        cargo bundle --format app --release
    - name: rust-clippy-check
      uses: actions-rs/clippy-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        name: macOS
        args: -- -D warnings
    - name: Archive Raw Application
      uses: actions/upload-artifact@v4
      with:
        name: Conductor_macos-latest
        path: target/release/conductor
    - name: Archive App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: Conductor.app
        path: target/release/bundle/osx/Conductor.app

  fmt:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: rust-toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true
          components: rustfmt
      - name: Install Dependencies
        run: |
          sudo sh -c 'echo "deb http://gb.archive.ubuntu.com/ubuntu jammy main" >> /etc/apt/sources.list'
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev
          sudo sed -i '/deb http:\/\/gb.archive.ubuntu.com\/ubuntu jammy main/d' /etc/apt/sources.list
          sudo apt-get update
          curl -sL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs libudev-dev libx11-dev libxi-dev libpango1.0-dev libatk1.0-dev libsoup2.4-dev libgtk-3-dev
      - name: Build frontend
        run: |
          export NODE_OPTIONS=--openssl-legacy-provider && make setup && make frontend
      - name: Formatter
        uses: mbrobbel/rustfmt-check@0.9.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}